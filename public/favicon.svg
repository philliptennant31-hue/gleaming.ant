<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Gleaming Ant">
  <rect width="32" height="32" rx="7" fill="#1E3A47"/>
  <!-- Tilted window pane (top edge rising to the right, as in the logo) -->
  <g transform="rotate(-15 15 14)">
    <rect x="6" y="5" width="18" height="18" rx="3" fill="#4FC3C8" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="14.4" y="5" width="1.2" height="18" fill="#FFFFFF"/>
    <rect x="6" y="13.4" width="18" height="1.2" fill="#FFFFFF"/>
  </g>
  <!-- Ant silhouette on the right, head up-left of the abdomen (facing left) -->
  <g fill="#FFFFFF">
    <circle cx="21.5" cy="21" r="7.6"/>
    <circle cx="15.4" cy="13.4" r="5.4"/>
  </g>
  <g fill="#1E3A47">
    <circle cx="21.5" cy="21" r="6"/>
    <circle cx="15.4" cy="13.4" r="4.1"/>
  </g>
  <circle cx="14.2" cy="12.2" r="1.6" fill="#FFFFFF"/>
</svg>
